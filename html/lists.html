<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lists</title>
</head>
<body>


    <h3>Unordered Lists</h3>

    <ul>
        <li>Fruits</li>
        <ul>
            <li>apple</li>
            <li>pear</li>
            <li>cherry</li>
        </ul>
        <li>Vegetables</li>
    </ul>

    <hr>

    <h3>Ordered Lists</h3>

    <ol type="I">
        <li>New York</li>
        <ol>
            <li>Manhattan</li>
            <li>Brooklyn</li>
        </ol>
        <li>Washington, DC</li>
        <ol type="a">
            <li>Capitol Hill</li>
            <li>Georgetown</li>
        </ol>
        <li>İstanbul</li>
        <ol type="i">
            <li>Beylikdüzü</li>
            <li>Maltepe</li>
        </ol>
        <li>Ankara</li>
        <ol>
            <li>Keçiören</li>
            <li>Çankaya</li>
        </ol>

    </ol>



    
</body>
</html>
